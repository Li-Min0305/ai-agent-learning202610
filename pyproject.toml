[project]
name = "ai-agent-core"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "li-min0305", email = "sarff001204mai@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.142.4",
    "langgraph>=1.2.14",
    "mcp>=1.0.0",
    "numpy>=2.5.3",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-agent-core = "ai_agent_core:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
